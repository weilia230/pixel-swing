<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>体素植物例图</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1b232c;
        color: #eaf2fa;
        font-family: "Microsoft YaHei", system-ui, sans-serif;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      h1 {
        position: absolute;
        left: 20px;
        top: 14px;
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: #f2f7fc;
        text-shadow: 0 2px 8px #0009;
        pointer-events: none;
      }
      .hint {
        position: absolute;
        right: 20px;
        top: 18px;
        font-size: 12px;
        color: #9fb0c0;
        pointer-events: none;
      }
      .label {
        position: absolute;
        transform: translate(-50%, 0);
        font-size: 13px;
        line-height: 1.3;
        color: #dfe9f2;
        background: #141b22cc;
        border: 1px solid #ffffff22;
        border-radius: 6px;
        padding: 2px 7px;
        white-space: nowrap;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/gallery.js"></script>
  </body>
</html>
