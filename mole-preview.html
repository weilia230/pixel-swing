<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>像素鼹鼠 · 四视图预览</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #2a1d26; }
      body {
        font-family: 'Courier New', 'PingFang SC', monospace;
        color: #ffe1a6;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        width: 100%;
        height: 100%;
        gap: 2px;
        background: #3a1e2c;
      }
      .cell {
        position: relative;
        overflow: hidden;
        background: #2a1d26;
      }
      .cell canvas {
        image-rendering: pixelated;
      }
      .cell__label {
        position: absolute;
        left: 12px;
        top: 12px;
        z-index: 2;
        padding: 4px 10px;
        background: rgba(42, 24, 36, 0.92);
        border: 2px solid #3a1e2c;
        box-shadow: 0 0 0 2px rgba(255, 207, 143, 0.45);
        font-size: 12px;
        letter-spacing: 0.16em;
        white-space: nowrap;
        pointer-events: none;
      }
      .hint {
        position: absolute;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        z-index: 3;
        padding: 3px 12px;
        background: rgba(42, 24, 36, 0.86);
        font-size: 11px;
        letter-spacing: 0.14em;
        color: rgba(255, 225, 166, 0.78);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/molePreview.jsx"></script>
  </body>
</html>
